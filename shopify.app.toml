# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "6ac368d0adacee74d48e1eae5a51cd49"
name = "tranfer-gangsheet-app"
application_url = "https://tranfer-gangsheet-app.vercel.app"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# write_files      -> upload route: stagedUploadsCreate + fileCreate
# write_draft_orders -> checkout route: draftOrderCreate
scopes = "write_products,write_metaobjects,write_metaobject_definitions,write_app_proxy,write_files,write_draft_orders"

[app_proxy]
url = "https://tranfer-gangsheet-app.vercel.app/apps/gang-sheet-builder"
subpath = "gang-sheet-builder"
prefix = "apps"

[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

[metaobjects.app.example]
name = "Example"
description = "An example metaobject definition created by this template"

  [metaobjects.app.example.access]
  admin = "merchant_read_write"

[metaobjects.app.example.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.example.fields.description]
name = "Description"
type = "multi_line_text_field"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[auth]
redirect_urls = [
  "https://tranfer-gangsheet-app.vercel.app/auth/callback",
  # One-off offline-token flow (home page -> /admin-token/start -> here).
  "https://tranfer-gangsheet-app.vercel.app/admin-token/callback"
]

[build]
automatically_update_urls_on_dev = true
dev_store_url = "jur51m-4z.myshopify.com"
